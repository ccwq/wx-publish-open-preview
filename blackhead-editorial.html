<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blackhead-editorial.wechat · 公众号排版预览</title>
<style>
  body{margin:0;background:#eef0f2;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;}
  .gzh-toolbar{position:fixed;top:0;left:0;right:0;height:54px;background:#ffffff;box-shadow:0 1px 10px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:99;}
  .gzh-hint{font-size:13px;color:#6b7280;line-height:1.4;}
  .gzh-hint b{color:#111827;}
  .gzh-copy{background:#059669;color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(5,150,105,.28);white-space:nowrap;transition:transform .08s,background .15s;}
  .gzh-copy:hover{background:#047857;}
  .gzh-copy:active{transform:translateY(1px);}
  .gzh-toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center;}
  .gzh-toast.show{opacity:1;}
  .gzh-stage{max-width:700px;margin:78px auto 64px;padding:0 8px;}
  @media(max-width:520px){.gzh-hint{max-width:150px;}}
</style>
</head>
<body>
<div class="gzh-toolbar">
  <span class="gzh-hint">👇 公众号兼容样稿 · RefID 已标注</span>
  <span style="display:flex;gap:8px;align-items:center;"><button class="gzh-copy" style="background:#111827;padding:10px 12px;" id="gzhRefBtn" onclick="gzhCopyRef()">复制 RefID</button><button class="gzh-copy" id="gzhCopyBtn" onclick="gzhCopy()">📋 复制到公众号</button></span>
</div>
<div class="gzh-toast" id="gzhToast"></div>
<div class="gzh-stage">
  <div id="gzh-content">
<section style="width:100%;max-width:677px;margin:0 auto;padding:8px;box-sizing:border-box;background:#FFFFFF;color:#1A1A1A;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Serif SC',sans-serif;line-height:1.75;">
  <section style="background:#111111;border:1px solid #111111;border-bottom:6px solid #C80018;border-radius:4px;overflow:hidden;padding:20px 18px;margin:0;">
    <span style="display:block;color:#FF5968;font-size:11px;font-weight:800;letter-spacing:2px;margin:0 0 10px;"><span leaf="">AG-RADAR · WORKFLOW BRIEF</span></span>
    <h3 style="font-size:27px;line-height:1.25;margin:0 0 10px;color:#FFFFFF;font-weight:800;"><span leaf="">先钉住结论，再把工作流拆开</span></h3>
    <span style="display:block;margin:0;color:#D7D7D7;font-size:14px;line-height:1.75;"><span leaf="">黑头、白纸、红色判断锚点：用于技术论证、调查复盘和动态流程说明。</span></span>
  </section>

  <section style="margin-top:24px;background:#FFFFFF;border:1px solid #DDDDDD;border-radius:4px;padding:15px;">
    <span style="display:inline-block;background:#111111;color:#C80018;padding:4px 8px;font-size:12px;font-weight:800;"><span leaf="">01</span></span>
    <h3 style="margin:10px 0 7px;font-size:18px;line-height:1.4;color:#1A1A1A;font-weight:800;"><span leaf="">先说可验证的主判断</span></h3>
    <span style="display:block;margin:0;font-size:14px;line-height:1.9;color:#1A1A1A;"><span leaf="">一个可靠流程不是工具越多越好，而是每一步都有输入、输出与可复查证据。</span></span>
    <section style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">
      <span style="display:inline-block;background:#E7F2FF;color:#175B91;padding:2px 8px;font-size:11px;font-weight:800;"><span leaf="">证据</span></span>
      <span style="display:inline-block;background:#E8F6EF;color:#276846;padding:2px 8px;font-size:11px;font-weight:800;"><span leaf="">边界</span></span>
      <span style="display:inline-block;background:#E7F2FF;color:#175B91;padding:2px 8px;font-size:11px;font-weight:800;"><span leaf="">责任点</span></span>
    </section>
  </section>

  <section style="margin-top:24px;border-left:5px solid #C80018;background:#FFF0F0;border-radius:0 4px 4px 0;padding:13px 15px;">
    <strong style="color:#1A1A1A;font-size:14px;"><span leaf="">核心判断：</span></strong>
    <span style="font-size:14px;line-height:1.9;color:#1A1A1A;"><span leaf="">红色负责结论，不负责把每个边框都做成警报。</span></span>
  </section>

  <section style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;">
    <section style="flex:1;background:#FFFFFF;border:1px solid #DDDDDD;border-radius:4px;padding:15px;">
      <span style="display:inline-block;background:#111111;color:#C80018;padding:4px 8px;font-size:12px;font-weight:800;"><span leaf="">A</span></span>
      <h4 style="margin:9px 0;font-size:16px;line-height:1.4;color:#1A1A1A;font-weight:800;"><span leaf="">传统做法</span></h4>
      <span style="display:block;margin:0;font-size:14px;line-height:1.9;color:#1A1A1A;"><span leaf="">任务直接交给工具，失败后难以解释问题出在哪里。</span></span>
    </section>
    <section style="flex:1;background:#FFFFFF;border:1px solid #DDDDDD;border-radius:4px;padding:15px;">
      <span style="display:inline-block;background:#111111;color:#C80018;padding:4px 8px;font-size:12px;font-weight:800;"><span leaf="">B</span></span>
      <h4 style="margin:9px 0;font-size:16px;line-height:1.4;color:#1A1A1A;font-weight:800;"><span leaf="">可审计做法</span></h4>
      <span style="display:block;margin:0;font-size:14px;line-height:1.9;color:#1A1A1A;"><span leaf="">把执行拆成步骤、证据和回退方案，结果才可复现。</span></span>
    </section>
  </section>

  <section style="margin-top:24px;background:#FFFFFF;border:1px solid #DDDDDD;border-radius:4px;padding:15px;">
    <span style="display:block;font-size:11px;letter-spacing:2px;font-weight:800;color:#C80018;margin:0 0 7px;"><span leaf="">02 · FLOW</span></span>
    <section style="padding:12px 0;border-top:2px solid #111111;">
      <strong style="font-size:15px;color:#1A1A1A;"><span leaf="1. 定义边界"></span></strong>
      <span style="display:block;margin:4px 0 0;font-size:14px;line-height:1.8;color:#4A4A4A;"><span leaf="哪些动作只读，哪些动作需要授权。"></span></span>
    </section>
    <section style="padding:12px 0;border-top:1px solid #DDDDDD;">
      <strong style="font-size:15px;color:#1A1A1A;"><span leaf="2. 保留证据"></span></strong>
      <span style="display:block;margin:4px 0 0;font-size:14px;line-height:1.8;color:#4A4A4A;"><span leaf="把输入、工具输出和验收结果放在同一条链路里。"></span></span>
    </section>
    <section style="padding:12px 0 0;border-top:1px solid #DDDDDD;">
      <strong style="font-size:15px;color:#1A1A1A;"><span leaf="3. 给出回退"></span></strong>
      <span style="display:block;margin:4px 0 0;font-size:14px;line-height:1.8;color:#4A4A4A;"><span leaf="失败时说明影响与替代路径，不伪造成功。"></span></span>
    </section>
  </section>

  <section style="margin-top:24px;background:#111111;border-left:6px solid #C80018;border-radius:4px;padding:16px;color:#FFFFFF;">
    <span style="display:block;font-size:11px;color:#FF5968;letter-spacing:2px;margin:0 0 7px;font-weight:800;"><span leaf="BOTTOM LINE"></span></span>
    <h3 style="margin:0 0 6px;font-size:19px;line-height:1.45;color:#FFFFFF;font-weight:800;"><span leaf="结构先于炫技，证据先于结论。"></span></h3>
    <span style="display:block;margin:0;color:#D7D7D7;font-size:14px;line-height:1.8;"><span leaf="适用于调查拆解、授权边界与复杂工作流说明。"></span></span>
  </section>
</section>

<ul style="display:none;margin:0;padding:0;"><li><span leaf=""></span></li></ul>
  </div>
</div>
<script>
  function gzhShowToast(msg){
    var t=document.getElementById('gzhToast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){t.classList.remove('show');},2800);
  }
  function gzhCopyRef(){
    var ref='wx-theme:blackhead-editorial';
    var done=function(){gzhShowToast('✅ 已复制主题 RefID：'+ref);var btn=document.getElementById('gzhRefBtn');var old=btn.textContent;btn.textContent='✅ RefID 已复制';setTimeout(function(){btn.textContent=old;},2200);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ref).then(done,function(){gzhShowToast('⚠ 请手动复制：'+ref);});}
    else{var x=document.createElement('textarea');x.value=ref;document.body.appendChild(x);x.select();try{document.execCommand('copy');done();}catch(e){gzhShowToast('⚠ 请手动复制：'+ref);}document.body.removeChild(x);}
  }
  function gzhCopy(){
    var el=document.getElementById('gzh-content');
    // 选中渲染后的富文本节点并复制（等价于手动 Ctrl+A / Ctrl+C，保留全部样式）
    var range=document.createRange();
    range.selectNodeContents(el);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    sel.removeAllRanges();
    var btn=document.getElementById('gzhCopyBtn');
    if(ok){
      gzhShowToast('✅ 已复制！去公众号编辑器按 Ctrl/⌘+V 粘贴即可');
      var old=btn.textContent;btn.textContent='✅ 已复制';
      setTimeout(function(){btn.textContent=old;},2200);
    }else{
      gzhShowToast('⚠ 自动复制失败，请手动全选(Ctrl/⌘+A)再复制(Ctrl/⌘+C)');
    }
  }
</script>
</body>
</html>
